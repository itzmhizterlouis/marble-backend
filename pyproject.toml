[project]
name = "marble-backend"
version = "0.1.0"
description = "Production API for Reverb creator publishing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=25.1,<26",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "celery[redis]>=5.5,<6",
  "redis>=6,<7",
  "supervisor>=4.2,<5",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
